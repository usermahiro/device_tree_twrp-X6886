name: Build Orangefox

on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'SYNC_URL'
        required: true
        default: 'https://gitlab.com/OrangeFox/sync.git'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: '14.1'
        type: choice
        options:
          - 12.1
          - 14.1
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/infinix/X6886'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL'
        required: false
      COMMON_TREE_BRANCH:
        description: 'COMMON_TREE_BRANCH'
        required: false
        default: 'main'
      COMMON_PATH:
        description: 'COMMON_PATH'
        required: false
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'X6886'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'fox_X6886'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'vendorboot'
      BUILD_LK:
        description: 'Build LK variant (Fenrir-LKPatch)'
        required: true
        type: boolean
        default: false

jobs:
  build:
    name: build (${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.BUILD_LK && '["default", "lk"]' || '["default"]') }}
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    env:
      USE_CCACHE: '1'
      CCACHE_EXEC: /usr/bin/ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}/workspace
      CCACHE_MAXSIZE: 5G
      CCACHE_COMPRESS: '1'
      CCACHE_COMPRESSLEVEL: '6'
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros
    steps:
      - name: Check Out
        uses: actions/checkout@v4

      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Initialize workspace
        run: |
          mkdir workspace
          cd workspace
          echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
        id: pwd

      - name: Prepare the build environment
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              git \
              python3 \
              tar \
              aria2 \
              patch \
              ccache
          git clone https://gitlab.com/OrangeFox/misc/scripts
          cd scripts
          sudo bash setup/android_build_env.sh
          sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
          sudo bash setup/install_android_sdk.sh
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      - name: Install OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Setup SSH Keys
        if: ${{ startsWith(github.event.inputs.COMMON_TREE_URL, 'git@github.com') }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Sync OrangeFox sources and minimal manifest
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}
          git clone ${{ github.event.inputs.SYNC_URL }}
          cd sync
          ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      - name: Install device tree from this repository
        run: |
          set -e
          SRC=${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          DEST="$SRC/${{ github.event.inputs.DEVICE_PATH }}"
          mkdir -p "$DEST"
          git -C "${{ github.workspace }}" ls-files -z \
            | grep -zv -e '^\.github/' -e '^tools/' \
            | tar -C "${{ github.workspace }}" --null -T - -cf - \
            | tar -C "$DEST" -xf -
          test -f "$DEST/vendorsetup.sh" || { echo "::error::vendorsetup.sh missing in $DEST"; exit 1; }
          test -d "$DEST/prebuilt/modules" || { echo "::error::prebuilt/modules missing"; exit 1; }
          test -d "$DEST/recovery/root/lib/modules/touch" || { echo "::error::recovery/root/lib/modules/touch missing"; exit 1; }
          ls -al "$DEST"
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      - name: Select fstab variant (${{ matrix.variant }})
        run: |
          set -e
          DEST="${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/${{ github.event.inputs.DEVICE_PATH }}"
          FS="$DEST/recovery/root/first_stage_ramdisk"
          [ -f "$FS/fstab.mt6789" ] && [ -f "$FS/fstab.mt6789lk" ] || { echo "::error::fstab.mt6789 / fstab.mt6789lk missing"; exit 1; }
          if [ "${{ matrix.variant }}" = "lk" ]; then
            # LK variant: fstab.mt6789lk is installed as fstab.mt6789
            mv -f "$FS/fstab.mt6789lk" "$FS/fstab.mt6789"
          else
            rm -f "$FS/fstab.mt6789lk"
          fi
          sha256sum "$FS"/fstab.mt6789*
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      - name: Clone common tree
        if: |
          github.event.inputs.COMMON_TREE_URL != null
          && github.event.inputs.COMMON_PATH != null
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          git clone ${{ github.event.inputs.COMMON_TREE_URL }} -b ${{ github.event.inputs.COMMON_TREE_BRANCH }} ./${{ github.event.inputs.COMMON_PATH }}
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Workaround for missing repo projects.
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          repo sync external/gflags
          repo sync external/guava
          repo sync hardware/google/interfaces
          repo sync hardware/google/pixel

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ github.event.inputs.DEVICE_NAME }}-

      - name: Configure ccache
        run: |
          set -e
          test -x "$CCACHE_EXEC" \vert{}\vert{} { echo "::error::$CCACHE_EXEC not found"; exit 1; }
          mkdir -p "$CCACHE_DIR"
          ccache --version | head -1
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --zero-stats
          echo "restored: ${{ steps.ccache-restore.outputs.cache-matched-key || 'none (cold cache)' }}"
          ccache --show-stats | head -20

      - name: Building recovery
        id: build
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_
