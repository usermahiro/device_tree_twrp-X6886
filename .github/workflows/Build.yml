name: Build Orangefox

on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'SYNC_URL'
        required: true
        default: 'https://gitlab.com/OrangeFox/sync.git'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: '14.1'
        type: choice
        options:
          - 12.1
          - 14.1
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/infinix/X6886'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL'
        required: false
      COMMON_TREE_BRANCH:
        description: 'COMMON_TREE_BRANCH'
        required: false
        default: 'main'
      COMMON_PATH:
        description: 'COMMON_PATH'
        required: false
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'X6886'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'fox_X6886'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'vendorboot'

jobs:
  build:
    name: build (${{ matrix.variant }})
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: [enforcing, permissive]
    steps:

    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Initialize workspace
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
      id: pwd

    - name: Prepare the build environment
      run: |
        sudo apt update && sudo apt upgrade -y
        DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            linux-modules-extra-$(uname -r) \
            git python3 tar aria2 patch
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh
        sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
        sudo bash setup/install_android_sdk.sh
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Setup SSH Keys
      if: ${{ startsWith(github.event.inputs.COMMON_TREE_URL, 'git@github.com') }}
      uses: webfactory/ssh-agent@v0.9.0
      with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Sync OrangeFox sources and minimal manifest
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}
        git clone ${{ github.event.inputs.SYNC_URL }}
        cd sync
        ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Install device tree from this repository
      run: |
        set -e
        SRC=${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        DEST="$SRC/${{ github.event.inputs.DEVICE_PATH }}"
        mkdir -p "$DEST"
        git -C "${{ github.workspace }}" ls-files -z \
          | grep -zv -e '^\.github/' -e '^tools/' \
          | tar -C "${{ github.workspace }}" --null -T - -cf - \
          | tar -C "$DEST" -xf -
        test -f "$DEST/vendorsetup.sh" || { echo "::error::vendorsetup.sh missing in $DEST"; exit 1; }
        test -d "$DEST/prebuilt/modules" || { echo "::error::prebuilt/modules missing"; exit 1; }
        test -d "$DEST/recovery/root/lib/modules/touch" || { echo "::error::recovery/root/lib/modules/touch missing"; exit 1; }
        ls -al "$DEST"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone common tree
      if: |
        github.event.inputs.COMMON_TREE_URL != null
        && github.event.inputs.COMMON_PATH != null
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        git clone ${{ github.event.inputs.COMMON_TREE_URL }} -b ${{ github.event.inputs.COMMON_TREE_BRANCH }} ./${{ github.event.inputs.COMMON_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Workaround for missing repo projects.
      run : |
        cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        repo sync external/gflags
        repo sync external/guava
        repo sync hardware/google/interfaces
        repo sync hardware/google/pixel

    - name: Building recovery
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        set +e
        source build/envsetup.sh
        source ${{ github.event.inputs.DEVICE_PATH }}/vendorsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_USE_ZSTD_BINARY=1
        if [ "${{ matrix.variant }}" = "permissive" ]; then
          export FOX_PERMISSIVE=1
        fi
        echo "Variant: ${{ matrix.variant }} (FOX_PERMISSIVE=${FOX_PERMISSIVE:-0})"
        set -eo pipefail
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}-ap2a-eng
        make clean
        mka adbd ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all) 2>&1 | tee ${{ steps.pwd.outputs.workspace-folder }}/build.log
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Check the output directory
      run: |
        OUT=${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}
        ls -al "$OUT"

    - name: Check module layout in ramdisks
      continue-on-error: true
      run: |
        OUT=${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}

        v_count=$(find "$OUT/vendor_ramdisk/lib/modules" -name '*.ko' 2>/dev/null | wc -l)
        echo "vendor_ramdisk/lib/modules: $v_count .ko"

        t_count=$(find "$OUT/recovery/root/lib/modules/touch" -name '*.ko' 2>/dev/null | wc -l)
        echo "recovery/root/lib/modules/touch: $t_count .ko"
        if [ "$t_count" -eq 0 ]; then
          echo "::warning::Modul touchscreen di recovery/root/lib/modules/touch tidak ditemukan!"
        fi

        root_count=$(find "$OUT/recovery/root/lib/modules" -maxdepth 1 -name '*.ko' 2>/dev/null | wc -l)
        echo "recovery/root/lib/modules: $root_count .ko"
        if [ "$root_count" -gt 0 ]; then
          echo "::warning::Ditemukan $root_count .ko langsung di root recovery/root/lib/modules! Modul platform berisiko menduplikasi vendor_ramdisk."
        fi

    - name: Verify variant image
      run: |
        set -e
        WS=${{ steps.pwd.outputs.workspace-folder }}
        OUT=$WS/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}
        V=${{ matrix.variant }}
        mkdir -p "$WS/variant"

        if [ ! -s "$OUT/vendor_boot.img" ]; then
          echo "::error::vendor_boot.img was not produced ($V)."
          exit 1
        fi
        IMG_SIZE=$(stat -c %s "$OUT/vendor_boot.img")
        echo "vendor_boot ($V): $IMG_SIZE bytes (partition: 67108864)"
        if [ "$IMG_SIZE" -gt 67108864 ]; then
          echo "::error::vendor_boot ($V) is larger than the 64 MiB partition."
          exit 1
        fi

        # sanity check: only the permissive image may carry the bootconfig flag
        if grep -aq "androidboot.selinux=permissive" "$OUT/vendor_boot.img"; then HAS=1; else HAS=0; fi
        if [ "$V" = "permissive" ] && [ "$HAS" != "1" ]; then
          echo "::error::permissive image has no androidboot.selinux=permissive in bootconfig."
          exit 1
        fi
        if [ "$V" = "enforcing" ] && [ "$HAS" != "0" ]; then
          echo "::error::enforcing image unexpectedly contains androidboot.selinux=permissive."
          exit 1
        fi
        cp "$OUT/vendor_boot.img" "$WS/variant/vendor_boot-$V.img"

    - name: Upload variant image
      uses: actions/upload-artifact@v4
      with:
        name: vendor_boot-${{ matrix.variant }}
        path: ${{ steps.pwd.outputs.workspace-folder }}/variant/vendor_boot-${{ matrix.variant }}.img
        if-no-files-found: error

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ github.run_id }}-${{ matrix.variant }}
        path: ${{ steps.pwd.outputs.workspace-folder }}/build.log
        if-no-files-found: ignore

  release:
    name: release
    needs: build
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:

    - name: Download variant images
      uses: actions/download-artifact@v4
      with:
        pattern: vendor_boot-*
        path: images
        merge-multiple: true

    - name: Prepare release files
      id: rel
      run: |
        set -e
        DEV=${{ github.event.inputs.DEVICE_NAME }}
        DATE=$(date -u +%Y%m%d)
        SHA=${GITHUB_SHA::7}
        mkdir -p release
        for V in enforcing permissive; do
          test -s "images/vendor_boot-$V.img" || { echo "::error::missing $V image"; exit 1; }
          cp "images/vendor_boot-$V.img" "release/OrangeFox-${DEV}-${DATE}-${SHA}-vendor_boot-${V}.img"
        done
        cd release
        sha256sum * > SHA256SUMS.txt
        ls -al

        echo "date=$DATE" >> "$GITHUB_OUTPUT"
        echo "tree_sha=$SHA" >> "$GITHUB_OUTPUT"
        echo "image_enforcing=OrangeFox-${DEV}-${DATE}-${SHA}-vendor_boot-enforcing.img" >> "$GITHUB_OUTPUT"
        echo "image_permissive=OrangeFox-${DEV}-${DATE}-${SHA}-vendor_boot-permissive.img" >> "$GITHUB_OUTPUT"

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release/*
        name: OrangeFox ${{ github.event.inputs.DEVICE_NAME }} -${{ steps.rel.outputs.date }}
        tag_name: ${{ github.event.inputs.DEVICE_NAME }}-${{ steps.rel.outputs.date }}-${{ github.run_number }}
        prerelease: true
        body: |
          Unofficial OrangeFox build for **${{ github.event.inputs.DEVICE_NAME }}**.

          | | |
          |---|---|
          | Manifest | ${{ github.event.inputs.MANIFEST_BRANCH }} |
          | Target | ${{ github.event.inputs.BUILD_TARGET }} |
          | Source | ${{ github.repository }} @ `${{ steps.rel.outputs.tree_sha }}` (${{ github.ref_name }}) |
          | Built | ${{ steps.rel.outputs.date }} (UTC) |

          Two variants are published (pick one):

          | File | SELinux |
          |---|---|
          | `${{ steps.rel.outputs.image_enforcing }}` | enforcing (default) |
          | `${{ steps.rel.outputs.image_permissive }}` | permissive (`androidboot.selinux=permissive` in bootconfig) |

          Flash Step:
          ```
          fastboot flash vendor_boot <image>
          ```
          Verify the download with `SHA256SUMS.txt`. Back up before flashing.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
